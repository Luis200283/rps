<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./imagenes/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tektur:wght@400..900&display=swap');
    </style>
    <title>ROCK-PAPER-SISOR</title>
</head>

<body>
    <div id="panel">
        <div id="panel-container">
            <div class="points">
                <input type="text" placeholder="Player" id="user-name">
                <div class="panel-point" id="player">0</div>
            </div>
            <div class="points">
                <p id="name">Computadora</p>
                <div class="panel-point" id="boot">0</div>
            </div>
        </div>
    </div>
    <div id="game">
        <div id="result-container">
            <div class="cube">
                <div class="face front">
                    <img src="imagenes/icon.png" alt="Player" class="img-result">
                </div>
                <div class="face back">
                    <img src="imagenes/papel.png" alt="">
                </div>
                <div class="face left">
                    <img src="imagenes/tijeras.png" alt="">
                </div>
                <div class="face right">
                    <img src="imagenes/piedra.png" alt="">
                </div>
            </div>
            <h1>VS</h1>
            <div class="cube">
                <div class="face front">
                    <img src="imagenes/icon.png" alt="Player" class="img-result" id="cube-result">
                </div>
                <div class="face back">
                    <img src="imagenes/papel.png" alt="">
                </div>
                <div class="face left">
                    <img src="imagenes/tijeras.png" alt="">
                </div>
                <div class="face right">
                    <img src="imagenes/piedra.png" alt="">
                </div>
            </div>
        </div>
        <div id="select-container">
            <img src="./imagenes/piedra.png" alt="piedra" class="select-rps">
            <img src="./imagenes/papel.png" alt="papel" class="select-rps">
            <img src="./imagenes/tijeras.png" alt="tijeras" class="select-rps">
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
